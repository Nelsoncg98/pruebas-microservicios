spring.application.name=ms-atencionmedica
server.port=${PORT:8097}

# Eureka
eureka.client.service-url.default-zone=${EUREKA_URL:http://localhost:8761/eureka}

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/atencionmedica;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
